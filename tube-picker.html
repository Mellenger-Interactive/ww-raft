<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tube Picker Block</title>
    <!-- Free fallbacks for WhiteWater's licensed futura-pt / Avenir (used only where those aren't installed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Nunito+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: Avenir, 'Avenir Next', 'Nunito Sans', sans-serif;
        background: #ffffff;
      }
      .demo-filler {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 16px;
        color: #1c355e;
      }
    </style>
  </head>
  <body>
    <div class="demo-filler"><p>↓ Page content above the block (scroll to check the page still scrolls over the preview)</p></div>

    <section id="tube-picker"></section>

    <div class="demo-filler" style="height: 60vh"><p>Page content below the block</p></div>

    <script type="module" src="/src/tube-picker.ts"></script>
  </body>
</html>
